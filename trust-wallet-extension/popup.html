<!DOCTYPE html>
<!-- translate="no": the wallet UI must never be auto-translated. Chrome/Opera page translation
     moves DOM text nodes, and React's commit phase then throws NotFoundError on removeChild
     (EXTENSION-WALLET-4GT) — besides translating amounts/addresses being unsafe on its own. -->
<html translate="no" style="width: 375px; height: 572px">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trust Wallet</title>
    <script src="/boot-theme.js"></script>
    <!-- Token/chain logos: open the CDN connection during boot so the first logo skips the
         ~0.8s TCP+TLS handshake (the CDN sends no cache headers; see uikit/utils/imageCache). -->
    <link rel="preconnect" href="https://assets-cdn.trustwallet.com" crossorigin="">
    <link rel="dns-prefetch" href="https://assets-cdn.trustwallet.com">
    <style>
      /* Loader shown before the JS bundle parses and React mounts, so the popup
         is never a blank white screen on a slow/cold start. It lives OUTSIDE
         #root as a persistent overlay React never touches — so its spin
         animation runs continuously from the first HTML paint until the app is
         ready, instead of restarting when React takes over. Render() removes it
         once the app has committed. */
      @keyframes tw-initial-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes tw-initial-reveal {
        to {
          opacity: 1;
        }
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #fcfcfc;
      }
      .tw-initial-loader__spinner {
        box-sizing: border-box;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 3px solid #999cab52;
        border-top: 3px solid #392ffa;
        opacity: 0;
        animation:
          tw-initial-spin 1s linear infinite,
          tw-initial-reveal 0s 200ms forwards;
      }
      :root[data-theme^='dark'] #initial-loader {
        background-color: #0f111a;
      }
      :root[data-theme^='dark'] .tw-initial-loader__spinner {
        border-color: #6675b252;
        border-top-color: #463cfa;
      }
      @media (prefers-reduced-motion: reduce) {
        .tw-initial-loader__spinner {
          animation: tw-initial-reveal 0s 200ms forwards;
        }
      }
    </style>
    <script type="module" crossorigin src="/chunks/dist-DU5seTHm.js"></script>
    <script type="module" crossorigin src="/chunks/dist-VBzpRx0l.js"></script>
    <script type="module" crossorigin src="/chunks/react-BMCv8LrQ.js"></script>
    <script type="module" crossorigin src="/chunks/logger-DAVuHUuS.js"></script>
    <script type="module" crossorigin src="/chunks/foreignDomMutationGuard-DgL4DgQq.js"></script>
    <script type="module" crossorigin src="/chunks/operationDiagnostics-Chn6IjKi.js"></script>
    <script type="module" crossorigin src="/chunks/preload-helper-Xn6ZgKKN.js"></script>
    <script type="module" crossorigin src="/chunks/popup-SFH8n7wi.js"></script>
  </head>
  <body style="width: 375px; height: 572px; margin: 0">
    <div id="initial-loader">
      <div class="tw-initial-loader__spinner"></div>
    </div>
    <div id="root" data-id="root"></div>
  </body>
</html>
